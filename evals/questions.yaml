structured_cases:
  - id: tasmola-may-observations
    question: Show Tasmola observations for May 2025.
    expected_intent: observation_analysis
    expected_reservoir: Tasmola
    min_observations: 3
    min_anomaly_flags: 2

  - id: tasmola-may-passport-comparison
    question: Compare Tasmola MNDWI area to passport area for May 2025.
    expected_intent: observation_analysis
    expected_reservoir: Tasmola
    min_observations: 3
    expected_calculation_metric: mndwi_area_vs_passport_area_percent_difference
    expected_value: -13.1
    tolerance: 0.01

  - id: tasmola-profile
    question: Tasmola reservoir profile
    expected_intent: reservoir_lookup
    expected_reservoir: Tasmola
